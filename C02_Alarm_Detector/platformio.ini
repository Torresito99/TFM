[platformio]
default_envs = esp32-mini

; =====================================================================
;  Dispositivo "gateway/alarma": ESP32 Mini (chip USB CH9102F).
;  - Escucha la baliza BLE de caida que emite el reloj (TFM-FALL).
;  - Al detectarla, avisa a Home Assistant por MQTT (misma señal que
;    enviaba el reloj antiguo: falldetector/fall).
;  - Lee el BME680 (temp/humedad/gas/CO2) y lo muestra por el monitor.
;  ESP32 clasico (WROOM-32): board = esp32dev.
; =====================================================================
[env:esp32-mini]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Puerto autodetectado (el CH9102 puede salir en COM7, COM8...). Si tuvieras
; varios dispositivos serie, descomenta y fija el que toque.
; monitor_port = COM8
; upload_port = COM8
; BLE (Bluedroid) + WiFi + MQTT no caben en la particion por defecto.
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

; --- Entorno antiguo (LilyGo T-Energy S3), se deja por referencia ---
[env:t-energy-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8
